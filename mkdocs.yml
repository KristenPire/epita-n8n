site_name: Automation with n8n — EPITA
site_description: AI agents and workflow automation with n8n. 12 hours, 4 sessions, one personal project.
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.footer

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - tables

nav:
  - Home: index.md
  - Survival Card: survival-card.md
  - "Séance 1 — Workflows":
      - "1.0 — Install n8n (Docker)": seance-1/ex-1-0-docker-install.md
      - "1.0b — Setup Sprint": seance-1/ex-1-0-setup.md
      - "1.1 — Good Morning, Founder": seance-1/ex-1-1-good-morning-founder.md
      - "1.2 — Lead Landed": seance-1/ex-1-2-lead-landed.md
      - "1.3 — Mention Radar": seance-1/ex-1-3-mention-radar.md
      - "1.4 — The Two Spreadsheets": seance-1/ex-1-4-two-spreadsheets.md
  - "Séance 2 — AI Agents":
      - "The API Menu": seance-2/menu-api.md
      - "2.1 — Two Sources": seance-2/ex-2-1-two-sources.md
      - "2.2 — The Analyst": seance-2/ex-2-2-the-analyst.md
      - "2.3 — Garbage In": seance-2/ex-2-3-garbage-in.md
      - "2.4 — The AI Agent": seance-2/ex-2-4-the-agent.md
  # Séance 3, 4: deliberately not in this repo yet — revealed progressively.
  # Full content backed up at ../docs-staging/ (outside this public repo). See
  # ../PREP-CHECKLIST.md "Progressive reveal" for how to bring each one back.
